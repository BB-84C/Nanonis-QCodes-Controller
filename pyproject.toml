[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nspmctl"
version = "0.2.0"
description = "Fast CLI over nanonis-spm for agent-driven Nanonis SPM controller automation"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "PyYAML>=6.0",
    "nanonis-spm>=1.0.3",
]

[project.optional-dependencies]
dev = [
    "black>=24.8.0",
    "mypy>=1.11.0",
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "types-PyYAML>=6.0.12.20241230",
]

[project.scripts]
nspmctl = "nspmctl.cli:main"

[tool.setuptools.packages.find]
include = ["nspmctl*"]

[tool.setuptools.package-data]
"nspmctl.resources" = ["config/*.yaml"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "simulator: requires Nanonis STM Simulator",
    "simulator_writes: guarded write scenarios on simulator",
]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["nspmctl"]
warn_unused_configs = true


